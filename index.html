<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="theme-color" content="#0d0d0f">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Circuit">
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="icon.svg">
<title>Circuit</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=DM+Mono:ital,wght@0,400;0,500;1,400&family=DM+Sans:wght@300;400;500;600&display=swap" rel="stylesheet">
<style>
/* ── reset & base ── */
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
:root{
  --bg:#0d0d0f;--surface:#18181c;--surface2:#222228;
  --border:rgba(255,255,255,0.07);--text:#f0ece8;--muted:#5a5560;
  --pull:#9d8df5;--legs:#5dcea0;--push:#f5a840;
  --blossom1:#f4a0c0;--blossom2:#e87aaa;--blossom3:#fce4ef;
  --bark1:#4a3728;--bark2:#6b5040;--dead:#2a2030;
  --tab-h:60px;--safe-b:env(safe-area-inset-bottom,0px);
}
html,body{height:100%;overflow:hidden;background:var(--bg);color:var(--text);
  font-family:'DM Sans',system-ui,sans-serif;font-size:16px;line-height:1.5}
button{font-family:inherit;cursor:pointer;border:none;background:none;color:inherit}
input,textarea{font-family:inherit;background:none;color:inherit;border:none;outline:none}
svg{display:block}

/* ── layout ── */
#app{height:100%;display:flex;flex-direction:column}
.tab-content{display:none;flex:1;overflow-y:auto;overflow-x:hidden;position:relative}
.tab-content.active{display:flex;flex-direction:column}

#tab-bar{
  flex-shrink:0;
  height:calc(var(--tab-h) + var(--safe-b));
  background:var(--surface);
  border-top:1px solid var(--border);
  display:flex;align-items:stretch;
  padding-bottom:var(--safe-b);
  z-index:100;
}
.tab-btn{
  flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;
  gap:3px;color:var(--muted);font-family:'DM Mono',monospace;font-size:10px;
  font-weight:500;letter-spacing:0.05em;min-height:44px;transition:color 0.15s;
}
.tab-btn.active{color:var(--blossom1)}
.tab-btn svg{width:22px;height:22px;transition:transform 0.15s}
.tab-btn.active svg{transform:scale(1.1)}

/* ── typography ── */
.bebas{font-family:'Bebas Neue',sans-serif}
.mono{font-family:'DM Mono',monospace}
.muted{color:var(--muted)}

/* ══════════════════════════════
   TREE TAB
══════════════════════════════ */
#tab-tree{background:var(--bg)}

.tree-header{
  position:absolute;top:0;left:0;right:0;
  display:flex;justify-content:space-between;align-items:flex-start;
  padding:16px 20px 0;z-index:10;pointer-events:none;
}
.tree-title{font-size:11px;font-family:'DM Mono',monospace;letter-spacing:0.12em;color:var(--muted);text-transform:uppercase}
.streak-badge{
  display:flex;flex-direction:column;align-items:center;
  background:rgba(244,160,192,0.1);border:1px solid rgba(244,160,192,0.25);
  border-radius:12px;padding:6px 12px;pointer-events:auto;
}
.streak-num{font-family:'Bebas Neue',sans-serif;font-size:28px;color:var(--blossom1);line-height:1}
.streak-label{font-size:9px;font-family:'DM Mono',monospace;color:var(--muted);letter-spacing:0.1em}

#tree-svg-container{
  width:100%;flex:1;min-height:0;position:relative;
}
#tree-svg-container svg{width:100%;height:100%}

.tree-footer{
  flex-shrink:0;padding:12px 20px;
  padding-bottom:calc(12px + var(--safe-b));
  display:flex;flex-direction:column;gap:10px;
  background:linear-gradient(to bottom, transparent, var(--bg) 30%);
}
.week-pips{display:flex;gap:8px;justify-content:center;align-items:center}
.week-pip{
  width:14px;height:14px;border-radius:50%;
  border:2px solid var(--muted);transition:all 0.3s;
}
.week-pip.done{background:var(--blossom1);border-color:var(--blossom1);box-shadow:0 0 8px rgba(244,160,192,0.5)}
.week-pip.partial{background:rgba(244,160,192,0.3);border-color:var(--blossom2)}

.week-history{overflow-x:auto;-webkit-overflow-scrolling:touch;scrollbar-width:none}
.week-history::-webkit-scrollbar{display:none}
.week-history-inner{display:flex;gap:6px;padding:4px 0;width:max-content;margin:0 auto}
.wh-dot{
  width:10px;height:10px;border-radius:50%;flex-shrink:0;
  transition:transform 0.2s;
}
.wh-dot:hover{transform:scale(1.4)}
.wh-dot.complete{background:var(--blossom1)}
.wh-dot.partial{background:rgba(244,160,192,0.35)}
.wh-dot.missed{background:var(--dead)}
.wh-dot.current{background:rgba(244,160,192,0.2);border:1.5px solid var(--blossom2)}

.session-msg{
  text-align:center;font-size:12px;color:var(--muted);
  font-family:'DM Mono',monospace;letter-spacing:0.05em;
  min-height:18px;
}

/* falling petals */
.petal-container{position:absolute;inset:0;pointer-events:none;overflow:hidden;z-index:5}
.petal{
  position:absolute;top:-20px;
  width:8px;height:8px;border-radius:50% 0 50% 0;
  background:var(--blossom1);opacity:0;
  animation:fall linear infinite;
}
@keyframes fall{
  0%{transform:translateY(0) rotate(0deg);opacity:0.7}
  100%{transform:translateY(110vh) rotate(360deg);opacity:0}
}

/* blossom bloom animation */
@keyframes bloomIn{
  0%{transform:scale(0) rotate(-180deg);opacity:0}
  60%{transform:scale(1.3) rotate(10deg);opacity:1}
  100%{transform:scale(1) rotate(0deg);opacity:1}
}
.blossom-new{animation:bloomIn 0.6s cubic-bezier(0.175,0.885,0.32,1.275) forwards}

/* branch grow animation */
@keyframes branchGrow{
  from{stroke-dashoffset:300}
  to{stroke-dashoffset:0}
}
.branch-new{stroke-dasharray:300;animation:branchGrow 0.8s ease-out forwards}
@keyframes fadeIn{from{opacity:0}to{opacity:1}}

/* ══════════════════════════════
   WORKOUT TAB
══════════════════════════════ */
#tab-workout{background:var(--bg)}
#workout-screen{flex:1;display:flex;flex-direction:column;overflow-y:auto}

/* pre-workout */
.pre-workout{padding:24px 20px;display:flex;flex-direction:column;gap:20px;flex:1}
.session-badge{
  display:inline-flex;gap:8px;align-items:center;
  padding:6px 12px;border-radius:20px;font-size:12px;
  font-family:'DM Mono',monospace;letter-spacing:0.05em;
}
.session-badge.pull{background:rgba(157,141,245,0.15);color:var(--pull);border:1px solid rgba(157,141,245,0.25)}
.session-badge.legs{background:rgba(93,206,160,0.15);color:var(--legs);border:1px solid rgba(93,206,160,0.25)}
.session-badge.push{background:rgba(245,168,64,0.15);color:var(--push);border:1px solid rgba(245,168,64,0.25)}

.pre-title{font-family:'Bebas Neue',sans-serif;font-size:48px;line-height:1;color:var(--text)}
.pre-subtitle{font-size:13px;color:var(--muted);font-family:'DM Mono',monospace}

.exercise-list{display:flex;flex-direction:column;gap:4px}
.exercise-row{
  display:flex;justify-content:space-between;align-items:center;
  padding:12px 16px;background:var(--surface);border-radius:10px;
  border:1px solid var(--border);
}
.exercise-row.focus{border-color:currentColor}
.exercise-row.focus.pull{color:var(--pull)}
.exercise-row.focus.legs{color:var(--legs)}
.exercise-row.focus.push{color:var(--push)}
.ex-name{font-size:14px;font-weight:500}
.ex-reps{font-family:'DM Mono',monospace;font-size:13px;color:var(--muted)}
.exercise-row.focus .ex-reps{color:currentColor;font-weight:500}

.big-btn{
  width:100%;padding:18px;border-radius:14px;
  font-family:'DM Sans',sans-serif;font-size:17px;font-weight:600;
  transition:opacity 0.15s,transform 0.1s;min-height:56px;
}
.big-btn:active{opacity:0.85;transform:scale(0.98)}
.btn-primary{background:var(--blossom2);color:#fff}
.btn-surface{background:var(--surface2);color:var(--text);border:1px solid var(--border)}
.btn-ghost{background:transparent;color:var(--muted);font-size:14px;font-weight:400;text-decoration:underline;min-height:44px}

/* mile screen */
.full-screen-phase{
  flex:1;display:flex;flex-direction:column;align-items:center;
  justify-content:center;gap:24px;padding:32px 24px;
  text-align:center;
}
.phase-label{font-size:12px;font-family:'DM Mono',monospace;letter-spacing:0.12em;color:var(--muted);text-transform:uppercase}
.big-timer{font-family:'Bebas Neue',sans-serif;font-size:96px;line-height:1;letter-spacing:2px;color:var(--text)}
.big-timer.counting-down{color:var(--blossom1)}
.phase-note{font-size:14px;color:var(--muted);max-width:260px}

/* circuit round screen */
.round-screen{flex:1;display:flex;flex-direction:column;padding:20px}
.round-header{display:flex;align-items:baseline;gap:12px;margin-bottom:8px}
.round-num{font-family:'Bebas Neue',sans-serif;font-size:80px;line-height:1;color:var(--text)}
.round-of{font-family:'DM Mono',monospace;font-size:14px;color:var(--muted)}
.round-exercises{flex:1;display:flex;flex-direction:column;gap:4px;margin:16px 0}

/* rest screen */
.rest-screen{
  flex:1;display:flex;flex-direction:column;align-items:center;
  justify-content:center;gap:20px;padding:32px 24px;text-align:center;
  background:var(--bg);
}
.rest-label{font-size:13px;font-family:'DM Mono',monospace;letter-spacing:0.1em;color:var(--muted)}
.rest-info{font-size:15px;color:var(--text)}

/* complete screen */
.complete-screen{
  flex:1;display:flex;flex-direction:column;align-items:center;
  justify-content:center;gap:20px;padding:32px 24px;text-align:center;
}
.complete-blossom{font-size:72px;animation:bloomIn 0.7s cubic-bezier(0.175,0.885,0.32,1.275) forwards}
.complete-title{font-family:'Bebas Neue',sans-serif;font-size:40px;color:var(--text)}
.stats-grid{
  display:grid;grid-template-columns:1fr 1fr;gap:8px;width:100%;max-width:280px;
}
.stat-card{
  background:var(--surface);border:1px solid var(--border);border-radius:10px;
  padding:12px;text-align:center;
}
.stat-val{font-family:'Bebas Neue',sans-serif;font-size:28px;color:var(--blossom1);line-height:1}
.stat-label{font-size:11px;color:var(--muted);font-family:'DM Mono',monospace;margin-top:2px}

.weekly-panel{
  width:100%;max-width:280px;
  background:rgba(244,160,192,0.08);
  border:1px solid rgba(244,160,192,0.3);
  border-radius:14px;padding:16px;text-align:center;
}
.weekly-panel-icon{font-size:32px}
.weekly-panel-title{font-family:'Bebas Neue',sans-serif;font-size:22px;color:var(--blossom1);margin:4px 0}
.weekly-panel-sub{font-size:13px;color:var(--muted)}

/* ══════════════════════════════
   PROGRAM TAB
══════════════════════════════ */
#tab-program{background:var(--bg)}
.program-scroll{flex:1;overflow-y:auto;padding:16px 16px calc(16px + var(--safe-b))}

.section-label{
  font-size:10px;font-family:'DM Mono',monospace;letter-spacing:0.15em;
  color:var(--muted);text-transform:uppercase;margin:20px 0 8px;
}
.section-label:first-child{margin-top:0}

/* block cards */
.block-card{
  background:var(--surface);border:1px solid var(--border);
  border-radius:12px;overflow:hidden;margin-bottom:8px;
}
.block-header{
  display:flex;justify-content:space-between;align-items:center;
  padding:14px 16px;cursor:pointer;
  -webkit-user-select:none;user-select:none;
}
.block-name{font-weight:600;font-size:15px}
.block-meta{font-size:12px;font-family:'DM Mono',monospace;color:var(--muted)}
.block-chevron{
  transition:transform 0.25s;color:var(--muted);font-size:18px;
  width:20px;height:20px;display:flex;align-items:center;justify-content:center;
}
.block-card.open .block-chevron{transform:rotate(180deg)}
.block-body{display:none;padding:0 16px 16px}
.block-card.open .block-body{display:block}

.prog-table{width:100%;border-collapse:collapse;font-size:12px;font-family:'DM Mono',monospace}
.prog-table th{
  color:var(--muted);font-weight:400;text-align:left;
  padding:6px 8px 6px 0;border-bottom:1px solid var(--border);
}
.prog-table td{
  padding:7px 8px 7px 0;border-bottom:1px solid rgba(255,255,255,0.04);
  vertical-align:middle;
}
.prog-table tr.current-session td{
  color:var(--blossom1);font-weight:500;background:rgba(244,160,192,0.06);
  border-radius:4px;
}
.prog-table tr.current-session td:first-child{
  border-left:3px solid var(--blossom1);padding-left:5px;
}
.focus-cell{font-weight:600}
.focus-cell.pull{color:var(--pull)}
.focus-cell.legs{color:var(--legs)}
.focus-cell.push{color:var(--push)}

/* exercise editor */
.ex-editor-row{
  background:var(--surface);border:1px solid var(--border);
  border-radius:10px;margin-bottom:6px;overflow:hidden;
}
.ex-editor-header{
  display:flex;justify-content:space-between;align-items:center;
  padding:12px 14px;
}
.ex-editor-name{font-size:14px;font-weight:500}
.ex-editor-current{font-size:12px;color:var(--muted);font-family:'DM Mono',monospace;margin-top:1px}
.ex-edit-btn{
  font-size:12px;font-family:'DM Mono',monospace;color:var(--blossom2);
  padding:6px 10px;border:1px solid rgba(232,122,170,0.3);border-radius:6px;
  white-space:nowrap;min-height:32px;
}
.ex-edit-panel{display:none;padding:12px 14px 14px;border-top:1px solid var(--border)}
.ex-editor-row.open .ex-edit-panel{display:block}
.preset-options{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:10px}
.preset-btn{
  padding:7px 12px;border-radius:8px;font-size:12px;
  background:var(--surface2);border:1px solid var(--border);color:var(--text);
  transition:all 0.15s;min-height:36px;
}
.preset-btn.selected{background:rgba(244,160,192,0.15);border-color:var(--blossom2);color:var(--blossom1)}
.custom-input-row{display:flex;gap:8px;margin-top:8px}
.custom-input{
  flex:1;padding:8px 12px;background:var(--surface2);
  border:1px solid var(--border);border-radius:8px;font-size:13px;
  color:var(--text);
}
.custom-input:focus{border-color:var(--blossom2)}
.save-btn{
  padding:8px 14px;background:var(--blossom2);color:#fff;
  border-radius:8px;font-size:13px;font-weight:600;min-height:36px;
}
.ex-desc{font-size:11px;color:var(--muted);margin-top:4px;font-style:italic}

/* ── generic utility ── */
.card{background:var(--surface);border:1px solid var(--border);border-radius:12px;padding:16px}
.row{display:flex;justify-content:space-between;align-items:center}
.gap8{gap:8px}
.mt8{margin-top:8px}
.mt16{margin-top:16px}
.text-center{text-align:center}

/* scrollbar hiding */
.hide-scrollbar::-webkit-scrollbar{display:none}
.hide-scrollbar{scrollbar-width:none}

/* ── calendar ── */
.cal-grid{display:flex;flex-direction:column;gap:3px;margin-bottom:4px}
.cal-week-row{display:grid;grid-template-columns:repeat(7,1fr);gap:3px}
.cal-day-label{
  font-size:9px;font-family:'DM Mono',monospace;color:var(--muted);
  text-align:center;padding-bottom:4px;letter-spacing:0.08em;
}
.cal-day{
  aspect-ratio:1;border-radius:4px;display:flex;align-items:center;
  justify-content:center;font-size:9px;font-family:'DM Mono',monospace;
  font-weight:600;
}
.cal-day.empty{background:rgba(255,255,255,0.04)}
.cal-day.future{background:none}
.cal-day.done{background:rgba(244,160,192,0.18);color:var(--blossom1)}
.cal-day.done-multi{background:rgba(232,122,170,0.28);color:#e87aaa}
.cal-month-label{
  font-size:10px;font-family:'DM Mono',monospace;color:var(--muted);
  letter-spacing:0.10em;margin:10px 0 5px;text-transform:uppercase;
}

/* ── reset button ── */
.reset-zone{
  margin-top:32px;padding:20px 0 8px;
  border-top:1px solid rgba(255,255,255,0.05);text-align:center;
}
.reset-btn{
  background:none;border:1px solid rgba(220,80,80,0.25);
  color:rgba(220,80,80,0.55);padding:9px 22px;border-radius:8px;
  font-family:'DM Sans',sans-serif;font-size:13px;cursor:pointer;
  transition:all 0.2s;
}
.reset-btn:active{border-color:rgba(220,80,80,0.5);color:rgba(220,80,80,0.9)}

/* ── cycle completion panel ── */
.cycle-panel{
  background:linear-gradient(135deg,rgba(157,141,245,0.08),rgba(244,160,192,0.08));
  border:1px solid rgba(244,160,192,0.2);border-radius:14px;
  padding:20px 16px;margin-top:16px;text-align:center;
}
.cycle-panel-title{
  font-family:'Bebas Neue',sans-serif;font-size:22px;
  color:var(--blossom1);margin-bottom:6px;
}
.cycle-panel-body{font-size:13px;color:var(--text);line-height:1.5;margin-bottom:14px}
.cycle-panel-sub{font-size:12px;color:var(--muted);font-family:'DM Mono',monospace;margin-top:4px}
.cycle-choice-row{display:flex;gap:10px;justify-content:center;flex-wrap:wrap}
.cycle-choice-btn{
  padding:10px 18px;border-radius:10px;font-size:13px;font-weight:600;
  font-family:'DM Sans',sans-serif;cursor:pointer;border:1px solid;
  transition:all 0.2s;min-height:44px;
}
.cycle-choice-btn.harder{
  background:rgba(157,141,245,0.12);border-color:rgba(157,141,245,0.35);color:var(--pull);
}
.cycle-choice-btn.standard{
  background:rgba(93,206,160,0.10);border-color:rgba(93,206,160,0.30);color:var(--legs);
}
.cycle-choice-btn.easier{
  background:rgba(245,168,64,0.10);border-color:rgba(245,168,64,0.30);color:var(--push);
}
</style>
</head>
<body>
<div id="app">

  <!-- ════════════ TREE TAB ════════════ -->
  <div id="tab-tree" class="tab-content active hide-scrollbar">
    <div class="tree-header">
      <div>
        <div class="tree-title">Circuit</div>
        <div id="session-msg" class="session-msg" style="margin-top:4px"></div>
      </div>
      <div class="streak-badge">
        <div class="streak-num bebas" id="streak-num">0</div>
        <div class="streak-label mono">week streak</div>
      </div>
    </div>

    <div id="tree-svg-container" style="flex:1;min-height:0">
      <div class="petal-container" id="petal-container"></div>
    </div>

    <div class="tree-footer">
      <div class="week-pips" id="week-pips">
        <div class="week-pip" id="pip-0"></div>
        <div class="week-pip" id="pip-1"></div>
        <div class="week-pip" id="pip-2"></div>
        <div class="week-pip" id="pip-3"></div>
      </div>
      <div style="text-align:center;font-size:11px;color:var(--muted);font-family:'DM Mono',monospace;margin-top:-4px">this week</div>
      <div class="week-history">
        <div class="week-history-inner" id="week-history-dots"></div>
      </div>
    </div>
  </div>

  <!-- ════════════ WORKOUT TAB ════════════ -->
  <div id="tab-workout" class="tab-content hide-scrollbar">
    <div id="workout-screen" style="flex:1;display:flex;flex-direction:column;overflow-y:auto"></div>
  </div>

  <!-- ════════════ PROGRAM TAB ════════════ -->
  <div id="tab-program" class="tab-content hide-scrollbar">
    <div class="program-scroll hide-scrollbar" id="program-content"></div>
  </div>

  <!-- ════════════ TAB BAR ════════════ -->
  <nav id="tab-bar">
    <button class="tab-btn active" data-tab="tree" onclick="switchTab('tree')">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round">
        <path d="M12 22V12"/>
        <path d="M12 12C12 12 7 9 7 5a5 5 0 0 1 10 0c0 4-5 7-5 7z"/>
        <path d="M12 12C12 12 17 10 19 7"/>
        <path d="M12 15C12 15 8 13.5 6 11"/>
      </svg>
      <span>Tree</span>
    </button>
    <button class="tab-btn" data-tab="workout" onclick="switchTab('workout')">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round">
        <circle cx="12" cy="12" r="10"/>
        <polyline points="12 6 12 12 16 14"/>
      </svg>
      <span>Workout</span>
    </button>
    <button class="tab-btn" data-tab="program" onclick="switchTab('program')">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round">
        <line x1="8" y1="6" x2="21" y2="6"/>
        <line x1="8" y1="12" x2="21" y2="12"/>
        <line x1="8" y1="18" x2="21" y2="18"/>
        <circle cx="3" cy="6" r="1" fill="currentColor"/>
        <circle cx="3" cy="12" r="1" fill="currentColor"/>
        <circle cx="3" cy="18" r="1" fill="currentColor"/>
      </svg>
      <span>Program</span>
    </button>
  </nav>
</div>

<script>
// ══════════════════════════════════════════════
//  CONSTANTS
// ══════════════════════════════════════════════
const PULL_REPS  = [5,6,7,8,8,9,9,10];
const LEG_REPS   = [10,12,14,16,16,18,18,20];
const PUSH_REPS  = [8,10,12,14,14,16,16,18];

const CORE_OPTIONS = [
  {name:'Plank hold — 45 sec',          desc:'Anti-extension, total core stability'},
  {name:'Hollow body hold — 30 sec',    desc:'Anterior core tension, lumbar bracing'},
  {name:'Dead bug — 10 each side',      desc:'Anti-extension with contralateral control'},
  {name:'Reverse crunches — 15 reps',   desc:'Lower abdominal focus, posterior tilt'},
  {name:'Ab wheel rollout — 8–10 reps', desc:'Anti-extension, lat + core chain'},
  {name:'Bicycle crunches — 20 reps',   desc:'Rotation + oblique activation'},
  {name:'Side plank — 30 sec each side',desc:'Lateral stability, quadratus lumborum'},
  {name:'Mountain climbers — 30 sec',   desc:'Dynamic core stability, hip flexor'},
];

const LEG_PRESETS = [
  'Bodyweight squats',
  'Bulgarian split squats',
  'Step-ups',
  'Wall sit — 45 sec',
  'Jump squats',
  'Reverse lunges',
];

const PUSHUP_PRESETS = [
  'Standard push-ups',
  'Wide grip push-ups',
  'Close grip push-ups',
  'Pike push-ups',
  'Archer push-ups',
];

const LATERAL_WEIGHTS = ['5lb','8lb','10lb','12lb','15lb','20lb'];

const STORAGE_KEY = 'circuit_v2';

// ══════════════════════════════════════════════
//  STATE
// ══════════════════════════════════════════════
function defaultState() {
  return {
    currentSession: 1,
    totalCompleted: 0,
    weekStreak: 0,
    history: [],
    exercises: {
      core: CORE_OPTIONS[0].name,
      legWeek1: 'Bodyweight squats',
      legWeek2: 'Bulgarian split squats',
      pushupVariation: 'Wide grip push-ups',
      lateralRaiseWeight: '10lb',
    }
  };
}

let state = (() => {
  try {
    const raw = localStorage.getItem(STORAGE_KEY);
    return raw ? Object.assign(defaultState(), JSON.parse(raw)) : defaultState();
  } catch { return defaultState(); }
})();

function saveState() {
  state.weekStreak = calcStreak();
  try { localStorage.setItem(STORAGE_KEY, JSON.stringify(state)); } catch{}
}

// ══════════════════════════════════════════════
//  DATE / WEEK UTILITIES
// ══════════════════════════════════════════════
function getWeekMonday(date) {
  const d = new Date(date);
  d.setHours(0,0,0,0);
  const day = d.getDay(); // 0=Sun
  const diff = (day === 0) ? -6 : 1 - day;
  d.setDate(d.getDate() + diff);
  return d;
}

function weekKey(date) {
  const m = getWeekMonday(date);
  return m.toISOString().slice(0,10);
}

function getAllWeeks() {
  if (!state.history.length) return [];
  const now = new Date();
  const firstDate = new Date(state.history[0].date);
  const start = getWeekMonday(firstDate);
  const end = getWeekMonday(now);
  const weeks = [];
  const cur = new Date(start);
  while (cur <= end) {
    const wk = cur.toISOString().slice(0,10);
    const sunday = new Date(cur);
    sunday.setDate(sunday.getDate() + 6);
    sunday.setHours(23,59,59,999);
    const sessions = state.history.filter(h => {
      const d = new Date(h.date);
      return d >= cur && d <= sunday;
    });
    const isCurrentWeek = wk === weekKey(now);
    const isPast = !isCurrentWeek && sunday < now;
    weeks.push({
      key: wk,
      monday: new Date(cur),
      sessions: sessions.length,
      isComplete: sessions.length >= 4,
      isCurrentWeek,
      isPast,
      isMissed: isPast && sessions.length < 4,
    });
    cur.setDate(cur.getDate() + 7);
  }
  return weeks;
}

function calcStreak() {
  const weeks = getAllWeeks();
  if (!weeks.length) return 0;
  let streak = 0;
  // walk backwards from most recent past complete week or current complete week
  for (let i = weeks.length - 1; i >= 0; i--) {
    const w = weeks[i];
    if (w.isCurrentWeek && w.sessions < 4) continue; // don't break streak on in-progress week
    if (w.isComplete) streak++;
    else if (w.isPast) break; // missed past week
  }
  return streak;
}

function thisWeekSessionCount() {
  const wk = weekKey(new Date());
  return state.history.filter(h => weekKey(new Date(h.date)) === wk).length;
}

// ══════════════════════════════════════════════
//  PROGRAM LOGIC
// ══════════════════════════════════════════════
function getSessionInfo(n) {
  // n is 1-indexed global session number
  const cyclePos = (n - 1) % 24;  // 0-23
  const cycle = Math.floor((n - 1) / 24);
  let block, blockSession;
  if (cyclePos < 8)       { block = 'pull'; blockSession = cyclePos + 1; }
  else if (cyclePos < 16) { block = 'legs'; blockSession = cyclePos - 7; }
  else                    { block = 'push'; blockSession = cyclePos - 15; }

  // Focus reps
  let pullReps, legReps, pushReps;
  if (block === 'pull') {
    pullReps = PULL_REPS[blockSession - 1] + cycle;
    legReps  = 10 + cycle;
    pushReps = 8  + cycle;
  } else if (block === 'legs') {
    pullReps = 6  + cycle;
    legReps  = LEG_REPS[blockSession - 1] + cycle;
    pushReps = 8  + cycle;
  } else {
    pullReps = 6  + cycle;
    legReps  = 12 + cycle;
    pushReps = PUSH_REPS[blockSession - 1] + cycle;
  }

  // Leg exercise: first 4 sessions of block = legWeek1, last 4 = legWeek2
  const legExercise = blockSession <= 4 ? state.exercises.legWeek1 : state.exercises.legWeek2;

  // Core: rotates by global session index
  const coreEntry = CORE_OPTIONS[(n - 1) % CORE_OPTIONS.length];
  const coreExercise = state.exercises.core || coreEntry.name;
  // use the rotating core each session
  const rotatingCore = coreEntry.name;

  // Push-up: check if this is 4th session this week
  const wk = weekKey(new Date());
  const sessionsThisWeek = state.history.filter(h => weekKey(new Date(h.date)) === wk).length;
  const isVariationDay = (sessionsThisWeek === 3); // 0-indexed: if 3 already done, this is #4
  const pushExercise = isVariationDay ? state.exercises.pushupVariation : 'Push-ups';

  return {
    n, block, blockSession, cycle,
    pullReps, legReps, pushReps,
    legExercise, coreExercise: rotatingCore, pushExercise,
    lateralWeight: state.exercises.lateralRaiseWeight,
  };
}

function blockLabel(block) {
  return block === 'pull' ? 'Pull focus' : block === 'legs' ? 'Leg focus' : 'Push focus';
}
function blockColor(block) {
  return block === 'pull' ? 'var(--pull)' : block === 'legs' ? 'var(--legs)' : 'var(--push)';
}
function blockClass(block) {
  return block === 'pull' ? 'pull' : block === 'legs' ? 'legs' : 'push';
}

// ══════════════════════════════════════════════
//  TREE SVG
// ══════════════════════════════════════════════
function lerp(a, b, t) { return a + (b - a) * t; }

function qBezier(t, x0, y0, cx, cy, x1, y1) {
  const mt = 1 - t;
  return {
    x: mt*mt*x0 + 2*mt*t*cx + t*t*x1,
    y: mt*mt*y0 + 2*mt*t*cy + t*t*y1,
  };
}

function buildTreeSVG(width, height, animateNew) {
  const weeks = getAllWeeks();
  const W = width, H = height;

  // Seeded XOR-shift RNG
  let _s = 0xcafe1234;
  const rng = () => { _s ^= _s << 13; _s ^= _s >> 17; _s ^= _s << 5; return (_s >>> 0) / 4294967296; };
  const rr  = (a, b) => a + rng() * (b - a);

  const CX = W * 0.50, BASE_Y = H * 0.97;

  // Fixed trunk — always the same proportions regardless of progress
  const trunkH    = H * 0.44;
  const trunkTopX = CX - W * 0.018;
  const trunkTopY = BASE_Y - trunkH;
  const trunkBotW = W * 0.072;
  const trunkTopW = W * 0.019;

  // ---- Helpers ----
  function taperedPath(x0, y0, x1, y1, w0, w1) {
    const dx=x1-x0, dy=y1-y0, l=Math.sqrt(dx*dx+dy*dy);
    if(l<0.5) return '';
    const nx=-dy/l, ny=dx/l;
    const ax=x0+nx*w0/2, ay=y0+ny*w0/2, bx=x0-nx*w0/2, by=y0-ny*w0/2;
    const cx=x1+nx*w1/2, cy=y1+ny*w1/2, dx2=x1-nx*w1/2, dy2=y1-ny*w1/2;
    const midX=(x0+x1)/2, midY=(y0+y1)/2, bulge=l*0.04;
    return `M ${ax.toFixed(1)} ${ay.toFixed(1)} Q ${(midX+nx*bulge).toFixed(1)} ${(midY+ny*bulge).toFixed(1)} ${cx.toFixed(1)} ${cy.toFixed(1)} L ${dx2.toFixed(1)} ${dy2.toFixed(1)} Q ${(midX-nx*bulge).toFixed(1)} ${(midY-ny*bulge).toFixed(1)} ${bx.toFixed(1)} ${by.toFixed(1)} Z`;
  }

  const along = (x0,y0,x1,y1,t) => ({x:x0+(x1-x0)*t, y:y0+(y1-y0)*t});

  function blossomFlower(bx, by, r, col, isNew) {
    const cols=['#f4a0c0','#fce4ef','#e87aaa','#f0b8d0','#f9c8de'];
    let p='';
    for(let i=0;i<5;i++){
      const a=(i/5)*Math.PI*2-Math.PI/2;
      const px=bx+Math.cos(a)*r*0.60, py=by+Math.sin(a)*r*0.60;
      p+=`<ellipse cx="${px.toFixed(1)}" cy="${py.toFixed(1)}" rx="${(r*0.54).toFixed(1)}" ry="${(r*0.38).toFixed(1)}" fill="${cols[i]}" opacity="0.87" transform="rotate(${(a*180/Math.PI+90).toFixed(1)},${px.toFixed(1)},${py.toFixed(1)})"/>`;
    }
    p+=`<circle cx="${bx.toFixed(1)}" cy="${by.toFixed(1)}" r="${(r*0.20).toFixed(1)}" fill="#ffe8f5" opacity="0.95"/>`;
    p+=`<circle cx="${bx.toFixed(1)}" cy="${by.toFixed(1)}" r="${(r*1.6).toFixed(1)}" fill="${col}" opacity="0.08"/>`;
    const anim=isNew?`style="transform-origin:${bx.toFixed(1)}px ${by.toFixed(1)}px;transform:scale(0);animation:bloomIn 0.6s cubic-bezier(0.175,0.885,0.32,1.275) 0.5s both"`:''
    return `<g ${anim}>${p}</g>`;
  }

  // ---- Trunk (filled cubic-bezier, always the same) ----
  const lbx=CX-trunkBotW/2, lby=BASE_Y, ltx=trunkTopX-trunkTopW/2, lty=trunkTopY;
  const lcp1x=lbx+W*0.010, lcp1y=BASE_Y-trunkH*0.32;
  const lcp2x=ltx-W*0.012, lcp2y=trunkTopY+trunkH*0.26;
  const rbx=CX+trunkBotW/2, rby=BASE_Y, rtx=trunkTopX+trunkTopW/2, rty=trunkTopY;
  const rcp1x=rbx-W*0.006, rcp1y=BASE_Y-trunkH*0.38;
  const rcp2x=rtx+W*0.014, rcp2y=trunkTopY+trunkH*0.20;

  function trunkPtAt(t) {
    const mt=1-t;
    return {
      x:((mt*mt*mt*lbx+3*mt*mt*t*lcp1x+3*mt*t*t*lcp2x+t*t*t*ltx)+(mt*mt*mt*rbx+3*mt*mt*t*rcp1x+3*mt*t*t*rcp2x+t*t*t*rtx))/2,
      y:BASE_Y-t*trunkH
    };
  }

  const trunkFill=`M ${lbx.toFixed(1)} ${lby.toFixed(1)} C ${lcp1x.toFixed(1)} ${lcp1y.toFixed(1)},${lcp2x.toFixed(1)} ${lcp2y.toFixed(1)},${ltx.toFixed(1)} ${lty.toFixed(1)} L ${rtx.toFixed(1)} ${rty.toFixed(1)} C ${rcp2x.toFixed(1)} ${rcp2y.toFixed(1)},${rcp1x.toFixed(1)} ${rcp1y.toFixed(1)},${rbx.toFixed(1)} ${rby.toFixed(1)} Z`;
  const hlbx=CX-trunkBotW*0.16,hltx=trunkTopX-trunkTopW*0.08,hrx=CX+trunkBotW*0.16,hrtx=trunkTopX+trunkTopW*0.12;
  const hlPath=`M ${hlbx.toFixed(1)} ${lby.toFixed(1)} C ${(hlbx+W*0.005).toFixed(1)} ${lcp1y.toFixed(1)},${(hltx-W*0.004).toFixed(1)} ${lcp2y.toFixed(1)},${hltx.toFixed(1)} ${lty.toFixed(1)} L ${hrtx.toFixed(1)} ${rty.toFixed(1)} C ${(hrtx+W*0.004).toFixed(1)} ${rcp2y.toFixed(1)},${(hrx-W*0.003).toFixed(1)} ${rcp1y.toFixed(1)},${hrx.toFixed(1)} ${rby.toFixed(1)} Z`;

  let barkLines='';
  _s=0xcafe1234;
  for(let k=0;k<9;k++){
    const t1=rr(0.06,0.50), t2=Math.min(t1+rr(0.10,0.28),0.92);
    const y1=BASE_Y-t1*trunkH, y2=BASE_Y-t2*trunkH;
    const bkW=trunkBotW*(1-t1)+trunkTopW*t1;
    const x1=CX+rr(-bkW*0.38,bkW*0.38), x2=CX+rr(-bkW*0.25,bkW*0.25);
    barkLines+=`<path d="M ${x1.toFixed(1)} ${y1.toFixed(1)} Q ${((x1+x2)/2+rr(-4,4)).toFixed(1)} ${((y1+y2)/2).toFixed(1)} ${x2.toFixed(1)} ${y2.toFixed(1)}" stroke="#1e1208" stroke-width="${rr(0.6,1.4).toFixed(1)}" fill="none" opacity="${rr(0.28,0.52).toFixed(2)}"/>`;
  }

  const rootW=(trunkBotW*0.38).toFixed(1);
  const rootFL=`M ${lbx.toFixed(1)} ${lby.toFixed(1)} Q ${(CX-trunkBotW*1.10).toFixed(1)} ${(BASE_Y-H*0.024).toFixed(1)} ${(CX-trunkBotW*1.60).toFixed(1)} ${BASE_Y.toFixed(1)}`;
  const rootFR=`M ${rbx.toFixed(1)} ${rby.toFixed(1)} Q ${(CX+trunkBotW*1.10).toFixed(1)} ${(BASE_Y-H*0.024).toFixed(1)} ${(CX+trunkBotW*1.60).toFixed(1)} ${BASE_Y.toFixed(1)}`;

  let trunkSVG=`<path d="${trunkFill}" fill="#3a2a1e"/>`;
  trunkSVG+=`<path d="${hlPath}" fill="#6b5040" opacity="0.25"/>`;
  trunkSVG+=barkLines;
  trunkSVG+=`<path d="${rootFL}" stroke="#3a2a1e" stroke-width="${rootW}" fill="none" stroke-linecap="round"/>`;
  trunkSVG+=`<path d="${rootFR}" stroke="#3a2a1e" stroke-width="${rootW}" fill="none" stroke-linecap="round"/>`;

  // ══════════════════════════════════════════════
  // 6 BRANCH CLUSTERS — one per week of the 6-week cycle
  // The skeleton is always visible (dim for future weeks).
  // Sessions fill in 5-petal blossom flowers at the 4 twig tips.
  // Full tree (all 24 sessions across 6 compliant weeks) = dense pink canopy.
  // ══════════════════════════════════════════════

  // Map: last 6 calendar weeks → clusters 0-5 (left to right)
  const recentWeeks = weeks.slice(-6);
  const slots = [];
  for(let i=0;i<6;i++){
    const idx = i - (6 - recentWeeks.length);
    slots.push(idx >= 0 ? recentWeeks[idx] : null);
  }

  // 6 cluster definitions: angle (radians), trunk attach height, main branch length
  const CLUSTERS = [
    {ang:148*Math.PI/180, attachT:0.86, len:W*0.235}, // far left
    {ang:124*Math.PI/180, attachT:0.92, len:W*0.268}, // left
    {ang:101*Math.PI/180, attachT:0.98, len:W*0.292}, // left-center (tallest)
    {ang: 79*Math.PI/180, attachT:0.98, len:W*0.292}, // right-center
    {ang: 56*Math.PI/180, attachT:0.92, len:W*0.268}, // right
    {ang: 32*Math.PI/180, attachT:0.86, len:W*0.235}, // far right
  ];

  let branchSVG='', blossomSVG='';

  CLUSTERS.forEach((def, ci) => {
    _s = (0x1111*(ci+1)) ^ (0x9b3f*(ci+1)*(ci+2)); // deterministic per-cluster seed

    const week = slots[ci];
    const sessionsDone = week ? Math.min(week.sessions, 4) : 0;
    const isDead = !!(week && week.isMissed);
    const isCurrentWeek = !!(week && week.isCurrentWeek);
    const isFuture = (week === null);
    const hasAny = !isFuture && sessionsDone > 0;

    const ap = trunkPtAt(def.attachT);
    const trunkW = trunkBotW*(1-def.attachT)+trunkTopW*def.attachT;
    const mainW0 = trunkW*0.78, mainW1 = mainW0*0.25;

    const mainEndX = ap.x+Math.cos(def.ang)*def.len;
    const mainEndY = ap.y-Math.sin(def.ang)*def.len;

    // Color scheme
    const liveCol='#4a3728', deadCol='#2a2030', futureCol='#1e1630';
    const branchCol = isDead ? deadCol : isFuture ? futureCol : liveCol;
    const branchOpacity = isFuture ? 0.38 : 1.0;

    // Wrap newest session's cluster in fade-in animation
    const isNewCluster = animateNew && isCurrentWeek && week && !week.isComplete && sessionsDone===1;
    const wrapOpen  = isNewCluster ? `<g style="opacity:0;animation:fadeIn 0.7s ease-out 0.1s forwards">` : '';
    const wrapClose = isNewCluster ? `</g>` : '';
    branchSVG += wrapOpen;

    // Main branch — filled tapered shape
    branchSVG+=`<path d="${taperedPath(ap.x,ap.y,mainEndX,mainEndY,mainW0,mainW1)}" fill="${branchCol}" opacity="${branchOpacity}"/>`;
    if(!isFuture && !isDead){
      const hi=along(ap.x,ap.y,mainEndX,mainEndY,0.18);
      branchSVG+=`<path d="${taperedPath(hi.x,hi.y,mainEndX,mainEndY,mainW0*0.24,0.5)}" fill="#6b5040" opacity="0.20"/>`;
    }

    // Sub-branches split at 58% along main, spreading ±26°
    const sp=along(ap.x,ap.y,mainEndX,mainEndY,0.58);
    const subLen=def.len*0.50, subW0=mainW1*1.55, subW1=subW0*0.22;
    const spread=26*Math.PI/180;
    const subAng1=def.ang+spread, subAng2=def.ang-spread;
    const s1ex=sp.x+Math.cos(subAng1)*subLen, s1ey=sp.y-Math.sin(subAng1)*subLen;
    const s2ex=sp.x+Math.cos(subAng2)*subLen, s2ey=sp.y-Math.sin(subAng2)*subLen;
    branchSVG+=`<path d="${taperedPath(sp.x,sp.y,s1ex,s1ey,subW0,subW1)}" fill="${branchCol}" opacity="${branchOpacity}"/>`;
    branchSVG+=`<path d="${taperedPath(sp.x,sp.y,s2ex,s2ey,subW0,subW1)}" fill="${branchCol}" opacity="${branchOpacity}"/>`;

    // Tertiary twigs — 2 per sub-branch = 4 twig tips (one per session slot)
    const terLen=subLen*0.46, terW=Math.max(subW1*0.85,1.2).toFixed(1);
    const twigSpread=21*Math.PI/180;
    const tips=[];
    [[s1ex,s1ey,subAng1],[s2ex,s2ey,subAng2]].forEach(([sx,sy,sa])=>{
      const t1a=sa+twigSpread, t2a=sa-twigSpread;
      const t1ex=sx+Math.cos(t1a)*terLen, t1ey=sy-Math.sin(t1a)*terLen;
      const t2ex=sx+Math.cos(t2a)*terLen, t2ey=sy-Math.sin(t2a)*terLen;
      branchSVG+=`<line x1="${sx.toFixed(1)}" y1="${sy.toFixed(1)}" x2="${t1ex.toFixed(1)}" y2="${t1ey.toFixed(1)}" stroke="${branchCol}" stroke-width="${terW}" stroke-linecap="round" opacity="${branchOpacity}"/>`;
      branchSVG+=`<line x1="${sx.toFixed(1)}" y1="${sy.toFixed(1)}" x2="${t2ex.toFixed(1)}" y2="${t2ey.toFixed(1)}" stroke="${branchCol}" stroke-width="${terW}" stroke-linecap="round" opacity="${branchOpacity}"/>`;
      tips.push({x:t1ex,y:t1ey});
      tips.push({x:t2ex,y:t2ey});
    });

    branchSVG += wrapClose;

    // ---- Blossoms ----
    const blossomCols=['#f4a0c0','#e87aaa','#fce4ef','#f0b8d0'];
    const flowerR=W*0.022;

    if(isDead){
      // Small dark buds on dead branches
      tips.forEach(tip=>{
        blossomSVG+=`<circle cx="${tip.x.toFixed(1)}" cy="${tip.y.toFixed(1)}" r="${(W*0.009).toFixed(1)}" fill="${deadCol}" opacity="0.55"/>`;
      });
    } else if(hasAny){
      for(let b=0;b<4;b++){
        if(b>=sessionsDone) break;
        const tip=tips[b];
        const isNewBlossom = animateNew && isCurrentWeek && b===sessionsDone-1;
        // 5 flowers clustered at each twig tip — adjacents overlap for dense canopy
        for(let f=0;f<5;f++){
          _s=(_s*1103515245+12345)&0x7fffffff;
          const ox=(_s%1000)/1000*W*0.052-W*0.026;
          _s=(_s*1103515245+12345)&0x7fffffff;
          const oy=(_s%1000)/1000*H*0.042-H*0.021;
          const fc=blossomCols[(b*3+f+ci)%4];
          const frs=flowerR*(0.72+(_s%100)/100*0.46);
          blossomSVG+=blossomFlower(tip.x+ox, tip.y+oy, frs, fc, isNewBlossom&&f===0);
        }
      }
    }

    // Pulsing dot for the current in-progress week
    if(isCurrentWeek && sessionsDone>0 && week && !week.isComplete){
      const ppt=tips[sessionsDone-1]||tips[0];
      const pr=W*0.015;
      blossomSVG+=`<circle cx="${ppt.x.toFixed(1)}" cy="${ppt.y.toFixed(1)}" r="${pr.toFixed(1)}" fill="var(--blossom2)" opacity="0.55">
        <animate attributeName="r" values="${pr};${(pr*1.8).toFixed(1)};${pr}" dur="2s" repeatCount="indefinite"/>
        <animate attributeName="opacity" values="0.55;0.1;0.55" dur="2s" repeatCount="indefinite"/>
      </circle>`;
    }
  });

  const defs=`<defs>
    <radialGradient id="sky" cx="50%" cy="12%" r="85%">
      <stop offset="0%" stop-color="#1e1230"/>
      <stop offset="60%" stop-color="#120e1e"/>
      <stop offset="100%" stop-color="#0d0d0f"/>
    </radialGradient>
  </defs>`;
  const bg=`<rect width="${W}" height="${H}" fill="url(#sky)"/>`;

  let emptyLabel='';
  if(weeks.length===0){
    emptyLabel=`<text x="${W/2}" y="${H*0.62}" text-anchor="middle" fill="#3a3040" font-family="DM Sans,sans-serif" font-size="${W*0.035}">Begin your first session</text>`;
  }

  return `<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 ${W} ${H}" style="overflow:visible">
    ${defs}${bg}${trunkSVG}${branchSVG}${blossomSVG}${emptyLabel}
  </svg>`;
}

function renderTree(animateNew) {
  const container = document.getElementById('tree-svg-container');
  const w = container.clientWidth || 320;
  const h = container.clientHeight || 420;
  container.querySelector('svg')?.remove();
  const petal = container.querySelector('.petal-container');
  const svg = document.createElementNS('http://www.w3.org/2000/svg','svg');
  svg.setAttribute('viewBox',`0 0 ${w} ${h}`);
  svg.setAttribute('width','100%');
  svg.setAttribute('height','100%');
  svg.innerHTML = buildTreeSVG(w, h, animateNew).replace(/^<svg[^>]+>/,'').replace(/<\/svg>$/,'');
  container.insertBefore(svg, petal);
}

function renderPetals() {
  const container = document.getElementById('petal-container');
  container.innerHTML = '';
  const colors = ['#f4a0c0','#e87aaa','#fce4ef'];
  for (let i = 0; i < 12; i++) {
    const p = document.createElement('div');
    p.className = 'petal';
    p.style.cssText = `
      left:${5 + Math.random()*90}%;
      width:${6+Math.random()*5}px;
      height:${6+Math.random()*5}px;
      background:${colors[i%3]};
      animation-duration:${8+Math.random()*12}s;
      animation-delay:${Math.random()*20}s;
      opacity:0;
      border-radius:${Math.random()>0.5?'50% 0 50% 0':'50%'};
    `;
    container.appendChild(p);
  }
}

function renderTreeUI() {
  // Streak
  document.getElementById('streak-num').textContent = state.weekStreak;

  // Week pips
  const count = thisWeekSessionCount();
  for (let i = 0; i < 4; i++) {
    const pip = document.getElementById(`pip-${i}`);
    pip.className = 'week-pip' + (i < count ? ' done' : count > i - 1 && count === i ? ' partial' : '');
  }

  // History dots
  const weeks = getAllWeeks();
  const dotsEl = document.getElementById('week-history-dots');
  dotsEl.innerHTML = weeks.map(w => {
    let cls = 'wh-dot ';
    if (w.isCurrentWeek) cls += 'current';
    else if (w.isComplete) cls += 'complete';
    else if (w.isMissed) cls += 'missed';
    else cls += 'partial';
    return `<div class="${cls}" title="${w.key}: ${w.sessions} sessions"></div>`;
  }).join('');

  // Scroll history dots to end
  setTimeout(() => {
    const hist = dotsEl.parentElement;
    hist.scrollLeft = hist.scrollWidth;
  }, 50);

  // Session message
  const info = getSessionInfo(state.currentSession);
  const msg = `Session ${info.blockSession} of 8 · ${blockLabel(info.block)}`;
  document.getElementById('session-msg').textContent = msg;
}

// ══════════════════════════════════════════════
//  TAB MANAGEMENT
// ══════════════════════════════════════════════
let activeTab = 'tree';

function switchTab(tab) {
  document.querySelectorAll('.tab-content').forEach(el => el.classList.remove('active'));
  document.querySelectorAll('.tab-btn').forEach(el => el.classList.remove('active'));
  document.getElementById(`tab-${tab}`).classList.add('active');
  document.querySelector(`.tab-btn[data-tab="${tab}"]`).classList.add('active');
  activeTab = tab;
  if (tab === 'tree') {
    renderTree(false);
    renderTreeUI();
  } else if (tab === 'workout') {
    renderWorkoutScreen();
  } else if (tab === 'program') {
    renderProgramTab();
  }
}

// ══════════════════════════════════════════════
//  WORKOUT FLOW
// ══════════════════════════════════════════════
let workout = {
  phase: 'pre',  // pre | mile | circuit | rest | complete
  round: 1,
  totalRounds: 10,
  mileStart: null,
  mileElapsed: 0,
  mileInterval: null,
  restStart: null,
  restInterval: null,
  sessionInfo: null,
};

function renderWorkoutScreen() {
  const screen = document.getElementById('workout-screen');
  switch (workout.phase) {
    case 'pre':      screen.innerHTML = buildPreWorkout(); break;
    case 'mile':     screen.innerHTML = buildMileScreen(); startMileTimer(); break;
    case 'circuit':  screen.innerHTML = buildCircuitScreen(); break;
    case 'rest':     screen.innerHTML = buildRestScreen(); startRestTimer(); break;
    case 'complete': screen.innerHTML = buildCompleteScreen(); break;
  }
}

function buildPreWorkout() {
  const info = getSessionInfo(state.currentSession);
  workout.sessionInfo = info;
  const bc = blockClass(info.block);
  const exercises = [
    {name: 'Pull-ups',           reps: `${info.pullReps} reps`,                     focus: info.block === 'pull'},
    {name: info.pushExercise,    reps: `${info.pushReps} reps`,                     focus: info.block === 'push'},
    {name: info.legExercise,     reps: `${info.legReps} reps`,                      focus: info.block === 'legs'},
    {name: info.coreExercise,    reps: '1 set',                                      focus: false},
    {name: 'Lateral raises',     reps: `${info.lateralWeight} × 12 reps`,           focus: false},
  ];
  const rows = exercises.map(e => `
    <div class="exercise-row${e.focus ? ` focus ${bc}` : ''}">
      <span class="ex-name">${e.name}</span>
      <span class="ex-reps">${e.reps}</span>
    </div>`).join('');

  return `<div class="pre-workout">
    <div>
      <span class="session-badge ${bc}">
        ${blockLabel(info.block)} · Session ${info.blockSession}/8
      </span>
      <div class="pre-title" style="margin-top:12px">Session ${state.currentSession}</div>
      <div class="pre-subtitle">10 rounds · 90 sec rest between rounds</div>
    </div>
    <div>
      <div style="font-size:12px;color:var(--muted);font-family:'DM Mono',monospace;margin-bottom:8px;letter-spacing:0.05em">Per round</div>
      <div class="exercise-list">${rows}</div>
    </div>
    <div style="flex:1"></div>
    <button class="big-btn btn-primary" onclick="beginSession()">Start session</button>
    <div style="height:8px"></div>
  </div>`;
}

function beginSession() {
  workout.phase = 'mile';
  workout.mileStart = Date.now();
  workout.mileElapsed = 0;
  renderWorkoutScreen();
}

function buildMileScreen() {
  return `<div class="full-screen-phase">
    <div class="phase-label">1 mile run</div>
    <div class="big-timer" id="mile-timer">0:00</div>
    <div class="phase-note">Run your mile. Tap done when you finish.</div>
    <div style="flex:1"></div>
    <button class="big-btn btn-primary" onclick="finishMile()">Mile done — start circuit</button>
    <div style="height:8px"></div>
  </div>`;
}

function startMileTimer() {
  clearInterval(workout.mileInterval);
  workout.mileInterval = setInterval(() => {
    if (workout.phase !== 'mile') { clearInterval(workout.mileInterval); return; }
    workout.mileElapsed = Math.floor((Date.now() - workout.mileStart) / 1000);
    const el = document.getElementById('mile-timer');
    if (el) el.textContent = fmtTime(workout.mileElapsed);
  }, 500);
}

function finishMile() {
  clearInterval(workout.mileInterval);
  workout.phase = 'circuit';
  workout.round = 1;
  renderWorkoutScreen();
}

function buildCircuitScreen() {
  const info = workout.sessionInfo || getSessionInfo(state.currentSession);
  const bc = blockClass(info.block);
  const exercises = [
    {name: 'Pull-ups',        reps: `${info.pullReps} reps`,          focus: info.block === 'pull'},
    {name: info.pushExercise, reps: `${info.pushReps} reps`,          focus: info.block === 'push'},
    {name: info.legExercise,  reps: `${info.legReps} reps`,           focus: info.block === 'legs'},
    {name: info.coreExercise, reps: '1 set',                           focus: false},
    {name: 'Lateral raises',  reps: `${info.lateralWeight} × 12 reps`, focus: false},
  ];
  const rows = exercises.map(e => `
    <div class="exercise-row${e.focus ? ` focus ${bc}` : ''}">
      <span class="ex-name">${e.name}</span>
      <span class="ex-reps">${e.reps}</span>
    </div>`).join('');

  const remaining = workout.totalRounds - workout.round;

  return `<div class="round-screen">
    <div class="round-header">
      <span class="round-num">${workout.round}</span>
      <span class="round-of mono muted">of ${workout.totalRounds}</span>
    </div>
    <div style="font-size:13px;color:var(--muted);font-family:'DM Mono',monospace;margin-bottom:12px">
      All exercises back to back — no rest within round
    </div>
    <div class="round-exercises">${rows}</div>
    <div style="flex:1"></div>
    <button class="big-btn btn-primary" onclick="doneRound()" style="margin-bottom:8px">Round done</button>
  </div>`;
}

function doneRound() {
  if (workout.round >= workout.totalRounds) {
    workout.phase = 'complete';
    recordSession();
    renderWorkoutScreen();
  } else {
    workout.phase = 'rest';
    workout.restStart = Date.now();
    renderWorkoutScreen();
  }
}

const REST_SECS = 90;

function buildRestScreen() {
  const remaining = workout.totalRounds - workout.round;
  return `<div class="rest-screen">
    <div class="rest-label">Rest</div>
    <div class="big-timer counting-down" id="rest-timer">${fmtTime(REST_SECS)}</div>
    <div class="rest-info">Round ${workout.round} complete — ${remaining} to go</div>
    <div style="flex:1"></div>
    <button class="big-btn btn-surface" onclick="skipRest()" style="max-width:280px">Skip rest</button>
    <div style="height:16px"></div>
  </div>`;
}

function startRestTimer() {
  clearInterval(workout.restInterval);
  workout.restInterval = setInterval(() => {
    if (workout.phase !== 'rest') { clearInterval(workout.restInterval); return; }
    const elapsed = Math.floor((Date.now() - workout.restStart) / 1000);
    const left = REST_SECS - elapsed;
    const el = document.getElementById('rest-timer');
    if (el) el.textContent = fmtTime(Math.max(0, left));
    if (left <= 0) {
      clearInterval(workout.restInterval);
      advanceToNextRound();
    }
  }, 250);
}

function skipRest() {
  clearInterval(workout.restInterval);
  advanceToNextRound();
}

function advanceToNextRound() {
  workout.round++;
  workout.phase = 'circuit';
  renderWorkoutScreen();
}

function recordSession() {
  const info = workout.sessionInfo || getSessionInfo(state.currentSession);
  const wk = weekKey(new Date());
  const weekSessions = state.history.filter(h => weekKey(new Date(h.date)) === wk);
  state.history.push({
    date: new Date().toISOString(),
    sessionNum: state.currentSession,
    blockKey: info.block,
    weekNum: getAllWeeks().length,
  });
  state.totalCompleted++;
  state.currentSession++;
  saveState();
}

function buildCompleteScreen() {
  const info = getSessionInfo(state.currentSession - 1);
  const streak = state.weekStreak;
  const wk = weekKey(new Date());
  const weekCount = state.history.filter(h => weekKey(new Date(h.date)) === wk).length;
  const isWeekComplete = weekCount >= 4;
  const cycleResult = checkCycleCompletion();

  const weekPanel = isWeekComplete && !cycleResult ? `
    <div class="weekly-panel">
      <div class="weekly-panel-icon">🌸</div>
      <div class="weekly-panel-title">Week complete.</div>
      <div class="weekly-panel-sub">A new branch grows on your tree.</div>
    </div>` : '';

  return `<div class="complete-screen">
    <div class="complete-blossom">🌸</div>
    <div class="complete-title">${cycleResult ? 'Cycle complete!' : 'Session done'}</div>
    <div style="font-size:13px;color:var(--muted);font-family:'DM Mono',monospace">
      ${blockLabel(info.block)} · ${info.blockSession} of 8
    </div>
    <div class="stats-grid">
      <div class="stat-card">
        <div class="stat-val">${workout.totalRounds}</div>
        <div class="stat-label">rounds</div>
      </div>
      <div class="stat-card">
        <div class="stat-val">${streak}</div>
        <div class="stat-label">week streak</div>
      </div>
      <div class="stat-card">
        <div class="stat-val">${state.totalCompleted}</div>
        <div class="stat-label">total sessions</div>
      </div>
      <div class="stat-card">
        <div class="stat-val">${weekCount}/4</div>
        <div class="stat-label">this week</div>
      </div>
    </div>
    ${weekPanel}
    ${cycleResult ? buildCycleCompletionPanel(cycleResult) : ''}
    <button class="big-btn btn-primary" onclick="goToTree()" style="max-width:280px">See your tree</button>
    <div style="height:8px"></div>
  </div>`;
}

function goToTree() {
  workout.phase = 'pre';
  switchTab('tree');
  setTimeout(() => renderTree(true), 100);
  setTimeout(() => renderTreeUI(), 150);
}

function fmtTime(secs) {
  const m = Math.floor(secs / 60);
  const s = secs % 60;
  return `${m}:${s.toString().padStart(2,'0')}`;
}

// ══════════════════════════════════════════════

// ══════════════════════════════════════════════
function renderProgramTab() {
  const container = document.getElementById('program-content');
  const cycleResult = checkCycleCompletion();
  container.innerHTML = buildBlockCards() + buildExerciseEditor() + buildCalendar()
    + buildCycleCompletionPanel(cycleResult)
    + `<div class="reset-zone"><button class="reset-btn" onclick="confirmReset()">Reset all data</button></div>`;
}

function buildBlockCards() {
  const n = state.currentSession;
  const cyclePos = (n - 1) % 24;
  const cycle = Math.floor((n - 1) / 24);

  const blocks = [
    {key:'pull', label:'Pull focus', color:'var(--pull)', sessions:1, focusCol:'Pull-ups', reps:PULL_REPS, maint:'Push-ups 8 · Legs 10'},
    {key:'legs', label:'Leg focus',  color:'var(--legs)', sessions:9, focusCol:'Legs',     reps:LEG_REPS,  maint:'Pull-ups 6 · Push-ups 8'},
    {key:'push', label:'Push focus', color:'var(--push)', sessions:17,focusCol:'Push-ups', reps:PUSH_REPS, maint:'Pull-ups 6 · Legs 12'},
  ];

  let html = `<div class="section-label">Program — 6-week block cycle</div>`;

  blocks.forEach(bl => {
    const isCurrentBlock = cyclePos >= (bl.sessions - 1) && cyclePos < (bl.sessions - 1 + 8);
    const blockPos = cyclePos - (bl.sessions - 1); // 0-7 within block

    let rows = '';
    for (let s = 1; s <= 8; s++) {
      const isCurrent = isCurrentBlock && blockPos === (s - 1);
      const rep = bl.reps[s-1] + cycle;
      rows += `<tr${isCurrent ? ' class="current-session"' : ''}>
        <td>${s}</td>
        <td class="focus-cell ${bl.key}">${rep}</td>
        <td style="color:var(--muted)">${bl.maint.replace(/\d+/g, m => parseInt(m)+cycle)}</td>
        ${isCurrent ? '<td style="color:var(--blossom1);font-size:11px">← now</td>' : '<td></td>'}
      </tr>`;
    }

    html += `<div class="block-card${isCurrentBlock?' open':''}" id="block-${bl.key}">
      <div class="block-header" onclick="toggleBlock('${bl.key}')">
        <div>
          <div class="block-name" style="color:${bl.color}">${bl.label}</div>
          <div class="block-meta">Weeks ${bl.sessions === 1 ? '1–2' : bl.sessions === 9 ? '3–4' : '5–6'} · 8 sessions</div>
        </div>
        <div class="block-chevron">
          <svg width="16" height="16" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="2">
            <polyline points="4,6 8,10 12,6"/>
          </svg>
        </div>
      </div>
      <div class="block-body">
        <table class="prog-table">
          <thead><tr>
            <th>Session</th>
            <th style="color:${bl.color}">${bl.focusCol}</th>
            <th>Maintenance</th>
            <th></th>
          </tr></thead>
          <tbody>${rows}</tbody>
        </table>
        <div style="font-size:11px;color:var(--muted);margin-top:10px;font-family:'DM Mono',monospace">
          Lateral raises: always ${state.exercises.lateralRaiseWeight} × 12 reps
        </div>
      </div>
    </div>`;
  });

  return html;
}

function toggleBlock(key) {
  const card = document.getElementById(`block-${key}`);
  card.classList.toggle('open');
}

function buildExerciseEditor() {

    },

    },

    },

      return `<button class="preset-btn${isSel ? ' selected' : ''}"
        onclick="selectPreset('${slot.key}','${p.name.replace(/'/g,"\\'")}',this)">

        </div>

function toggleEditor(key) {
  const row = document.getElementById(`editor-${key}`);
  row.classList.toggle('open');
}

function selectPreset(key, value, btn) {
  state.exercises[key] = value;
  saveState();
  // Update UI
  const panel = btn.closest('.ex-edit-panel');
  panel.querySelectorAll('.preset-btn').forEach(b => b.classList.remove('selected'));
  btn.classList.add('selected');
  // Update current display
  const row = panel.closest('.ex-editor-row');
  row.querySelector('.ex-editor-current').textContent = value;
}

function saveCustom(key) {
  const input = document.getElementById(`custom-${key}`);
  const val = input.value.trim();
  if (!val) return;
  state.exercises[key] = val;
  saveState();
  const row = document.getElementById(`editor-${key}`);
  row.querySelector('.ex-editor-current').textContent = val;
  row.querySelectorAll('.preset-btn').forEach(b => b.classList.remove('selected'));
  input.value = '';
  toggleEditor(key);
}

// ══════════════════════════════════════════════
//  CALENDAR
// ══════════════════════════════════════════════
function buildCalendar() {
  if(!state.history.length) return '';

  const byDate = {};
  state.history.forEach(h => {
    const d = new Date(h.date).toISOString().slice(0,10);
    byDate[d] = (byDate[d]||0)+1;
  });

  const now = new Date();
  const todayStr = now.toISOString().slice(0,10);
  // Show last 13 weeks
  const monday = getWeekMonday(now);
  let html = `<div class="section-label" style="margin-top:24px">Activity — last 13 weeks</div>`;
  html += `<div class="cal-grid">`;
  // Day headers
  html += `<div class="cal-week-row cal-header">`;
  ['M','T','W','T','F','S','S'].forEach(d=>{ html+=`<div class="cal-day-label">${d}</div>`; });
  html += `</div>`;

  for(let w=12;w>=0;w--){
    html += `<div class="cal-week-row">`;
    for(let d=0;d<7;d++){
      const day = new Date(monday);
      day.setDate(day.getDate() - w*7 + d);
      const key = day.toISOString().slice(0,10);
      const count = byDate[key]||0;
      const isFuture = key > todayStr;
      if(isFuture){
        html+=`<div class="cal-day future"></div>`;
      } else if(count===0){
        html+=`<div class="cal-day empty" title="${key}"></div>`;
      } else if(count===1){
        html+=`<div class="cal-day done" title="${key}: ${count} session">·</div>`;
      } else {
        html+=`<div class="cal-day done-multi" title="${key}: ${count} sessions">${count}</div>`;
      }
    }
    html += `</div>`;
  }
  html += `</div>`;
  return html;
}

// ══════════════════════════════════════════════
//  CYCLE COMPLETION
// ══════════════════════════════════════════════
function checkCycleCompletion() {
  // Returns null if no cycle just completed, else {compliantWeeks, cycleNum}
  // A cycle is sessions 1-24, 25-48, etc.
  const completed = state.totalCompleted;
  if(completed === 0 || completed % 24 !== 0) return null;
  const cycleNum = completed / 24;
  // Count compliant weeks in the last 6 calendar weeks
  const last6 = getAllWeeks().slice(-6);
  const compliantWeeks = last6.filter(w=>w.isComplete).length;
  return { cycleNum, compliantWeeks };
}

function buildCycleCompletionPanel(cycleResult) {
  if(!cycleResult) return '';
  const { compliantWeeks, cycleNum } = cycleResult;
  const isHigh = compliantWeeks >= 5;
  const isLow  = compliantWeeks <= 3;

  let rec, details;
  if(isHigh){
    rec = 'Advance: harder program';
    details = `${compliantWeeks}/6 compliant weeks — excellent discipline. The next cycle adds heavier reps and introduces ring push-ups and pistol squats as optional variations.`;
  } else if(isLow){
    rec = 'Adjust: modified program';
    details = `${compliantWeeks}/6 compliant weeks — consistency was the challenge. The next cycle keeps the same rep scheme but reduces the focus block peak by 1 rep to make hitting all 4 sessions easier.`;
  } else {
    rec = 'Continue: standard progression';
    details = `${compliantWeeks}/6 compliant weeks — solid work. Standard +1 rep baseline increase applies to all movements next cycle.`;
  }

  return `<div class="cycle-panel">
    <div class="cycle-panel-title">Cycle ${cycleNum} complete</div>
    <div class="cycle-panel-body">${details}</div>
    <div class="cycle-choice-row">
      ${isHigh||(!isLow&&!isHigh)?`<button class="cycle-choice-btn harder" onclick="applyCycleChoice('harder')">Harder</button>`:''}
      <button class="cycle-choice-btn standard" onclick="applyCycleChoice('standard')">Standard</button>
      ${isLow||(!isLow&&!isHigh)?`<button class="cycle-choice-btn easier" onclick="applyCycleChoice('easier')">Easier</button>`:''}
    </div>
    <div class="cycle-panel-sub">${rec}</div>
  </div>`;
}

function applyCycleChoice(choice) {
  state.cycleChoice = choice; // stored but not used to change rep tables — user awareness feature
  saveState();
  // Remove panel
  const panel = document.querySelector('.cycle-panel');
  if(panel){ panel.style.opacity='0'; panel.style.transition='opacity 0.4s'; setTimeout(()=>panel.remove(),400); }
}

// ══════════════════════════════════════════════
//  RESET
// ══════════════════════════════════════════════
function confirmReset() {
  if(confirm('Reset everything? Your tree, all session history, and streak will be permanently deleted.')) {
    localStorage.removeItem(STORAGE_KEY);
    location.reload();
  }
}

// ══════════════════════════════════════════════
//  INIT
// ══════════════════════════════════════════════
function init() {
  // Register service worker
  if ('serviceWorker' in navigator) {
    navigator.serviceWorker.register('./sw.js').catch(() => {});
  }

  // Recalculate streak on load
  state.weekStreak = calcStreak();
  saveState();

  // Render initial tree
  renderTree(false);
  renderTreeUI();
  renderPetals();

  // Re-render tree on resize
  let resizeTimer;
  window.addEventListener('resize', () => {
    clearTimeout(resizeTimer);
    resizeTimer = setTimeout(() => {
      if (activeTab === 'tree') renderTree(false);
    }, 150);
  });
}

// Defer init until fonts + layout settle
if (document.readyState === 'loading') {
  document.addEventListener('DOMContentLoaded', init);
} else {
  // small delay so the container has measured dimensions
  setTimeout(init, 50);
}
</script>
</body>
</html>
